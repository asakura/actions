name: Secret scan

on:
  workflow_call:
    inputs:
      tool-source:
        description: "`pinned` runs gitleaks/trufflehog from nixpkgs at `nixpkgs-rev`; `flake` uses the caller's flake via `--inputs-from .`."
        type: string
        required: true
      nixpkgs-rev:
        description: Nixpkgs commit providing the tools when `tool-source` is `pinned`; unused when it is `flake`.
        type: string
        required: true
      trufflehog:
        description: Whether to also run trufflehog (verified only) in the full-history scan.
        type: boolean
        required: true
      idle-days:
        description: Skip the scheduled full-history scan when the default branch has no commits in this many days. 0 disables the check.
        type: number
        required: true
      issue-title:
        description: Title of a newly created failure issue. Existing issues are found by a hidden marker, not by title.
        type: string
        required: true
      timeout-minutes:
        description: Timeout of each job.
        type: number
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Fast gate: scans only the commits a PR adds.
  gitleaks-pr:
    name: gitleaks-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # check out the repository history to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: gitleaks (PR commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOOL_SOURCE: ${{ inputs.tool-source }}
          NIXPKGS_REV: ${{ inputs.nixpkgs-rev }}
        run: |
          case "${TOOL_SOURCE}" in
            pinned) nix_args=(run "github:NixOS/nixpkgs/${NIXPKGS_REV}#gitleaks") ;;
            flake) nix_args=(run --inputs-from . nixpkgs#gitleaks) ;;
            *) echo "unknown tool-source: ${TOOL_SOURCE}" >&2; exit 2 ;;
          esac
          nix "${nix_args[@]}" -- detect --redact --no-banner --exit-code=1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  # Slow sweep: full history, re-verifies old credentials and applies newly
  # released detector rules. Skipped on schedule when the repository is idle.
  full-history:
    name: full-history
    if: github.event_name != 'pull_request' && github.repository_owner == 'asakura'
    outputs:
      default-branch: ${{ steps.ref.outputs.default }}
      open-issue: ${{ steps.issues.outputs.open }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # check out the repository history to scan
      issues: read # look for an open scan issue that a passing scan must resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Feeds notify's condition: the issue is about the default branch, so
      # runs of any other ref (e.g. a manual run on a feature branch) leave
      # issues alone.
      - name: check the ref is the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [[ "${GITHUB_REF}" == "refs/heads/${default_branch}" ]]; then
            default=true
          else
            default=false
          fi
          echo "default=${default}" | tee -a "${GITHUB_OUTPUT}"

      - name: check for new commits
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          IDLE_DAYS: ${{ inputs.idle-days }}
        run: |
          run=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${IDLE_DAYS}" -gt 0 ]]; then
            default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
            latest=$(git log --since="${IDLE_DAYS} days ago" -1 --format=%H "origin/${default_branch}")
            if [[ -z "${latest}" ]]; then
              run=false
            fi
          fi
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"

      - if: steps.recent.outputs.run == 'true'
        uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: gitleaks (all history)
        if: steps.recent.outputs.run == 'true'
        env:
          TOOL_SOURCE: ${{ inputs.tool-source }}
          NIXPKGS_REV: ${{ inputs.nixpkgs-rev }}
        run: |
          case "${TOOL_SOURCE}" in
            pinned) nix_args=(run "github:NixOS/nixpkgs/${NIXPKGS_REV}#gitleaks") ;;
            flake) nix_args=(run --inputs-from . nixpkgs#gitleaks) ;;
            *) echo "unknown tool-source: ${TOOL_SOURCE}" >&2; exit 2 ;;
          esac
          nix "${nix_args[@]}" -- detect --redact --no-banner --exit-code=1 \
            --log-opts="--all"

      - name: trufflehog (verified only)
        if: steps.recent.outputs.run == 'true' && inputs.trufflehog
        env:
          TOOL_SOURCE: ${{ inputs.tool-source }}
          NIXPKGS_REV: ${{ inputs.nixpkgs-rev }}
        run: |
          case "${TOOL_SOURCE}" in
            pinned) nix_args=(run "github:NixOS/nixpkgs/${NIXPKGS_REV}#trufflehog") ;;
            flake) nix_args=(run --inputs-from . nixpkgs#trufflehog) ;;
            *) echo "unknown tool-source: ${TOOL_SOURCE}" >&2; exit 2 ;;
          esac
          # No --no-update: nixpkgs' trufflehog wrapper already passes it, and
          # trufflehog rejects the flag when it is repeated.
          nix "${nix_args[@]}" -- git file://. \
            --only-verified --fail

      # Feeds notify's condition: after a pass, notify runs only when there is
      # an open issue to resolve.
      - name: look for an open scan issue
        id: issues
        if: ${{ success() && steps.recent.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: <!-- asakura-actions-secret-scan -->
        run: |
          # An issue created without a body has a null body: absence is part
          # of the data, so jq's // is right here.
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r --arg marker "${MARKER}" \
              '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .number' \
            | wc -l)
          if [[ "${count}" -gt 0 ]]; then
            open=true
          else
            open=false
          fi
          echo "open=${open}" | tee -a "${GITHUB_OUTPUT}"

  # A failure only reaches the owner via GitHub's default notifications, which
  # are easy to miss or disabled. An open issue, found by a hidden marker, is a
  # visible, trackable record: one issue is reused while the scan fails and is
  # closed with an explanation once a full scan passes. It runs only for the
  # default branch, and only when a scan failed or passed while an open issue
  # exists. Runs whose commit is no longer the head change nothing.
  notify:
    name: notify
    needs: full-history
    if: ${{ !cancelled() && needs.full-history.outputs.default-branch == 'true' && (needs.full-history.result == 'failure' || (needs.full-history.result == 'success' && needs.full-history.outputs.open-issue == 'true')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # read the head of the ref to detect out-of-order runs
      issues: write # open, comment on and close the scan issue
    steps:
      - name: update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: ${{ inputs.issue-title }}
          SCAN_RESULT: ${{ needs.full-history.result }}
          MARKER: <!-- asakura-actions-secret-scan -->
        run: |
          set -euo pipefail

          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF}" --jq .sha)
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "run commit ${GITHUB_SHA} is not the head of ${GITHUB_REF} (${head_sha}); leaving issues unchanged"
            exit 0
          fi

          # An issue created without a body has a null body: absence is part
          # of the data, so jq's // is right here.
          listing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r --arg marker "${MARKER}" \
              '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .number')
          issues=()
          if [[ -n "${listing}" ]]; then
            sorted=$(sort -n <<<"${listing}")
            mapfile -t issues <<<"${sorted}"
          fi

          if [[ "${SCAN_RESULT}" == "success" ]]; then
            body="The full-history scan passed on ${GITHUB_SHA}: ${RUN_URL}

          No finding is detected any more: it was removed from history, allowlisted, or (trufflehog) the credential no longer verifies. If a real secret was ever exposed, it must already have been rotated."
            for number in "${issues[@]}"; do
              gh issue comment "${number}" --body "${body}"
              echo "commented on #${number}"
              gh issue close "${number}" --reason completed
              echo "closed #${number} as completed"
            done
            exit 0
          fi

          body="The full-history scan on ${GITHUB_SHA} found a possible secret or failed to run: ${RUN_URL}

          Treat any finding as compromised: rotate the credential first; rewriting history alone is not enough."
          if [[ "${#issues[@]}" -eq 0 ]]; then
            url=$(gh issue create --title "${ISSUE_TITLE}" --body "${body}

          ${MARKER}")
            echo "created ${url}"
            exit 0
          fi

          keep="${issues[0]}"
          gh issue comment "${keep}" --body "${body}"
          echo "commented on #${keep}"
          for number in "${issues[@]:1}"; do
            gh issue comment "${number}" --body "Duplicate of #${keep}"
            echo "commented on #${number}"
            gh issue close "${number}" --reason "not planned"
            echo "closed #${number} as duplicate of #${keep}"
          done
