name: Secret scan

on:
  workflow_call:
    inputs:
      trufflehog:
        description: Whether the full-history scan also runs trufflehog, which reports only credentials it verified as live.
        type: boolean
        required: true
      idle-days:
        description: Skip a scheduled full-history scan when the default branch has no commit in this many days. 0 turns the check off.
        type: number
        required: true
      issue-title:
        description: Title of a new failure issue. Existing issues are found by a hidden marker, not by title.
        type: string
        required: true
      timeout-minutes:
        description: Timeout of each job.
        type: number
        required: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  # Identifies the failure issue: notify puts it in the body of the issue it
  # creates, and full-history finds open issues by it.
  MARKER: <!-- asakura-actions-secret-scan -->
  # Release tarball, used by both jobs; bump the version together with its
  # sha256, the digest of gitleaks_<version>_linux_x64.tar.gz in that
  # release. Not the Ubuntu archive's package, whose detection rules are
  # years behind upstream's and miss current token formats.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Fast gate: scans only the commits the pull request adds.
  gitleaks-pr:
    name: gitleaks-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # check out the commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" gitleaks

      # --verbose prints each finding (file, line, commit, rule) with the
      # secret redacted. gitleaks exits 0 when git itself fails, so an ERR
      # line in its log fails the step.
      - name: gitleaks (pull request commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          "${RUNNER_TEMP}/bin/gitleaks" git --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --verbose --no-banner --no-color --exit-code=1 . 2>"${log}" || status=$?
          cat "${log}" >&2
          if grep -qE '^[^ ]+ ERR ' "${log}"; then
            echo "gitleaks logged errors, so the scan did not finish" >&2
            exit 1
          fi
          exit "${status}"

  # Slow sweep: every commit of every branch and tag, with the scanners'
  # current rules, which can find what the scan of a commit's pull request
  # missed.
  full-history:
    name: full-history
    if: github.event_name != 'pull_request' && github.repository_owner == 'asakura'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      default-branch: ${{ steps.plan.outputs.default-branch }}
      report: ${{ steps.report.outputs.report }}
      issues: ${{ steps.issues.outputs.numbers }}
    permissions:
      contents: read # check out the history to scan; list the default branch's recent commits
      issues: read # find the open scan issues that notify updates
    steps:
      # Runs before the checkout, so an idle scheduled run clones nothing.
      # default-branch feeds notify's condition: the issue is about the
      # default branch, so runs of any other ref leave issues alone.
      - name: Decide whether to scan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          IDLE_DAYS: ${{ inputs.idle-days }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [[ "${GITHUB_REF}" == "refs/heads/${default_branch}" ]]; then
            echo "default-branch=true" | tee -a "${GITHUB_OUTPUT}"
          else
            echo "default-branch=false" | tee -a "${GITHUB_OUTPUT}"
          fi

          scan=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${IDLE_DAYS}" -gt 0 ]]; then
            since=$(date -u -d "${IDLE_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
            recent=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" \
              -f sha="${default_branch}" -f since="${since}" -f per_page=1 --jq length)
            if [[ "${recent}" -eq 0 ]]; then
              scan=false
            fi
          fi
          echo "scan=${scan}" | tee -a "${GITHUB_OUTPUT}"

      - id: checkout
        if: steps.plan.outputs.scan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        id: install_gitleaks
        if: steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" gitleaks

      - name: Install trufflehog
        id: install_trufflehog
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && inputs.trufflehog }}
        env:
          # Release tarball; bump the version together with its sha256, the
          # digest of trufflehog_<version>_linux_amd64.tar.gz in that release.
          TRUFFLEHOG_VERSION: 3.99.9
          TRUFFLEHOG_SHA256: 12050095c8063bf4d34f9f6cbce6ba9fa8d0deea9d503d0570364feba093658e
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trufflehog.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${archive}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" trufflehog

      # Each scan runs whenever its scanner is installed, also after the
      # other one failed, so the report covers both. It writes its findings
      # to <tool>.txt, one Markdown line each without the secret, and prints
      # them. The file is empty both when the tool passed and when it failed
      # before finishing; the report step tells the two apart by the step's
      # outcome. gitleaks exits 0 when git itself fails, so an ERR line in
      # its log fails the step.
      - name: gitleaks (full history)
        id: gitleaks
        if: ${{ !cancelled() && steps.install_gitleaks.outcome == 'success' }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          "${RUNNER_TEMP}/bin/gitleaks" git --log-opts=--all --redact --no-banner --no-color \
            --exit-code=1 --report-format=json --report-path="${report}" . 2>"${log}" || status=$?
          cat "${log}" >&2
          if grep -qE '^[^ ]+ ERR ' "${log}"; then
            echo "gitleaks logged errors, so the scan did not finish" >&2
            status=1
          fi
          # gitleaks writes no report when it stops early, for example on an
          # invalid .gitleaks.toml.
          if [[ -f "${report}" ]]; then
            jq -r '.[] | "- `\(.File)` line \(.StartLine) in commit \(.Commit[0:12]): \(.RuleID) (\(.Description))"' \
              "${report}" | tee "${RUNNER_TEMP}/gitleaks.txt"
          else
            : >"${RUNNER_TEMP}/gitleaks.txt"
          fi
          exit "${status}"

      # The JSON results hold the raw credential, so only the rendered lines
      # are printed. --fail fails the step on a finding and
      # --fail-on-scan-errors on a scan that did not finish.
      - name: trufflehog (full history, verified only)
        id: trufflehog
        if: ${{ !cancelled() && steps.install_trufflehog.outcome == 'success' }}
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/trufflehog.jsonl"
          status=0
          "${RUNNER_TEMP}/bin/trufflehog" git file://. --results=verified --json \
            --no-update --no-color --fail --fail-on-scan-errors >"${results}" || status=$?
          jq -r '"- `\(.SourceMetadata.Data.Git.file)` line \(.SourceMetadata.Data.Git.line) in commit \(.SourceMetadata.Data.Git.commit[0:12]): \(.DetectorName) credential, verified as live"' \
            "${results}" | tee "${RUNNER_TEMP}/trufflehog.txt"
          exit "${status}"

      # Feeds the body of the issue notify writes when the scan failed.
      - name: Report the failure
        id: report
        if: failure() && steps.plan.outputs.default-branch == 'true'
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
          TRUFFLEHOG: ${{ inputs.trufflehog }}
          MAX_FINDINGS: 50
        run: |
          set -euo pipefail
          # Prints, as Markdown, what one scanner found, from its step outcome
          # and its <tool>.txt.
          describe() {
            local tool=$1 outcome=$2
            local findings="${RUNNER_TEMP}/${tool}.txt"
            local total
            case "${outcome}" in
              success)
                echo "${tool} found nothing."
                ;;
              failure)
                if [[ -s "${findings}" ]]; then
                  total=$(wc -l <"${findings}")
                  echo "${tool} found:"
                  echo
                  head -n "${MAX_FINDINGS}" "${findings}"
                  if [[ "${total}" -gt "${MAX_FINDINGS}" ]]; then
                    echo "- and $((total - MAX_FINDINGS)) more in the run log"
                  fi
                else
                  echo "${tool} failed before finishing the scan; see the run log."
                fi
                ;;
              *)
                echo "${tool} did not run because an earlier step failed; see the run log."
                ;;
            esac
          }

          report=$(describe gitleaks "${GITLEAKS_OUTCOME}")
          if [[ "${TRUFFLEHOG}" == "true" ]]; then
            report+=$'\n\n'$(describe trufflehog "${TRUFFLEHOG_OUTCOME}")
          fi
          if [[ -s "${RUNNER_TEMP}/gitleaks.txt" || -s "${RUNNER_TEMP}/trufflehog.txt" ]]; then
            report+=$'\n\n'"Treat every finding as compromised: rotate the credential first; removing it from history is not enough."
          fi
          delimiter="report_$(openssl rand -hex 16)"
          printf 'report<<%s\n%s\n%s\n' "${delimiter}" "${report}" "${delimiter}" \
            | tee -a "${GITHUB_OUTPUT}"

      # Feeds notify: after a pass, notify runs only when an issue is open.
      - name: Find the open scan issues
        id: issues
        if: ${{ !cancelled() && steps.plan.outputs.default-branch == 'true' && steps.plan.outputs.scan == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          numbers=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -c --arg marker "${MARKER}" \
              '[.[][] | select(.pull_request == null and .user.login == "github-actions[bot]" and .body != null and (.body | contains($marker))) | .number] | sort')
          echo "numbers=${numbers}" | tee -a "${GITHUB_OUTPUT}"

  # A failure only reaches the owner through GitHub's notifications, which are
  # easy to miss or turned off. One issue, found by the marker, is a visible
  # record: it is reused while the scan fails and closed with an explanation
  # once a full scan passes. notify runs only for the default branch, and only
  # when the scan failed or passed while an issue is open.
  notify:
    name: notify
    needs: full-history
    if: ${{ !cancelled() && needs.full-history.outputs.default-branch == 'true' && needs.full-history.outputs.issues != '' && (needs.full-history.result == 'failure' || needs.full-history.outputs.issues != '[]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # read the head of the ref to detect out-of-order runs
      issues: write # open, comment on and close the scan issue
    steps:
      - name: Update the scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: ${{ inputs.issue-title }}
          SCAN_RESULT: ${{ needs.full-history.result }}
          REPORT: ${{ needs.full-history.outputs.report }}
          ISSUES: ${{ needs.full-history.outputs.issues }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF}" --jq .sha)
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "run commit ${GITHUB_SHA} is not the head of ${GITHUB_REF} (${head_sha}); leaving issues unchanged"
            exit 0
          fi

          issues=()
          listing=$(jq -r '.[]' <<<"${ISSUES}")
          if [[ -n "${listing}" ]]; then
            mapfile -t issues <<<"${listing}"
          fi

          if [[ "${SCAN_RESULT}" == "success" ]]; then
            body="The full-history secret scan of ${GITHUB_SHA} passed: ${RUN_URL}

          The findings reported here are gone: removed from history, allowlisted, or (trufflehog) the credential no longer verifies. If a real secret was exposed, it must already have been rotated."
            for number in "${issues[@]}"; do
              gh issue comment "${number}" --body "${body}"
              echo "commented on #${number}"
              gh issue close "${number}" --reason completed
              echo "closed #${number} as completed"
            done
            exit 0
          fi

          body="The full-history secret scan of ${GITHUB_SHA} failed: ${RUN_URL}

          ${REPORT}"
          if [[ "${#issues[@]}" -eq 0 ]]; then
            url=$(gh issue create --title "${ISSUE_TITLE}" --body "${body}

          ${MARKER}")
            echo "created ${url}"
            exit 0
          fi

          keep="${issues[0]}"
          gh issue comment "${keep}" --body "${body}"
          echo "commented on #${keep}"
          for number in "${issues[@]:1}"; do
            gh issue comment "${number}" --body "Duplicate of #${keep}"
            echo "commented on #${number}"
            gh issue close "${number}" --reason "not planned"
            echo "closed #${number} as a duplicate of #${keep}"
          done
