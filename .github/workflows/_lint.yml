name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      active-comment: ${{ steps.comment.outputs.active }}
      suggestions-work: ${{ steps.suggestions.outputs.work }}
    permissions:
      contents: read # check out the scripts and workflows to lint and test; read the files of the merge base to compare pins
      pull-requests: read # list the changed files; find the lint comment and the suggestion threads
    steps:
      # The pull request's head commit, not the merge commit GitHub checks out
      # by default: suggested changes are placed by head-commit line numbers,
      # and merging a newer main shifts them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # Decides which tools run; it never filters their findings.
      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/changed-files.sh

      # The check steps are skipped independently, so none is sure to run
      # first; they all write their output here. It runs whenever any check
      # can run, and before the install, the only step that can fail between
      # it and the checks.
      - name: Create the lint output directory
        if: ${{ steps.changes.outputs.workflows == 'true' || steps.changes.outputs.scripts == 'true' || steps.changes.outputs.markdown == 'true' }}
        run: mkdir -p "${RUNNER_TEMP}/lint"

      # One step installs every tool whenever any check can run: a single
      # apt-get update is cheaper than one per tool group. The archive has no
      # mdformat plugins (no GFM tables), so tables are formatted as plain
      # paragraphs.
      - name: Install the lint tools
        if: ${{ steps.changes.outputs.workflows == 'true' || steps.changes.outputs.scripts == 'true' || steps.changes.outputs.markdown == 'true' }}
        env:
          # Release tarballs; bump each version together with its sha256.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt mdformat
          .github/scripts/install-binary.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" actionlint actionlint
          .github/scripts/install-binary.sh \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "${ZIZMOR_SHA256}" zizmor zizmor
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # Each check keeps its own exit status (the step turns red) and saves
      # its human-readable output for the report. Annotations are workflow
      # commands, which are for the runner, not for people: they are derived
      # separately and never saved into the report.
      - name: actionlint
        id: actionlint
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' }}
        env:
          SHELLCHECK_OPTS: --enable=all --severity=style
          # gcc-style "file:line:col: error: message [kind]" plus the source
          # snippet: readable in the report, and annotate-gcc.sh parses it.
          ACTIONLINT_FORMAT: '{{range $err := .}}{{$err.Filepath}}:{{$err.Line}}:{{$err.Column}}: error: {{$err.Message}} [{{$err.Kind}}]\n{{$err.Snippet}}\n\n{{end}}'
        run: |
          actionlint -no-color -format "${ACTIONLINT_FORMAT}" 2>&1 \
            | tee "${RUNNER_TEMP}/lint/actionlint.txt" \
            | .github/scripts/annotate-gcc.sh

      - name: zizmor
        id: zizmor
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --persona=auditor --format=plain --color=never --render-links=never \
            --show-audit-urls=always --quiet . 2>&1 \
            | tee "${RUNNER_TEMP}/lint/zizmor.txt"

      # zizmor's readable output has no line format to parse, so annotations
      # need a second run in its github format; only when there are findings.
      # It exits like the zizmor step, which has already failed the job.
      - name: zizmor annotations
        if: ${{ !cancelled() && steps.zizmor.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=auditor --format=github --quiet .

      # Every SHA pin must end with exactly "# vX.Y.Z"; a failing line gets a
      # suggested comment when a tag points at its commit. Prints gcc-style
      # findings, like actionlint, and the suggested fixes as a diff for the
      # suggestion plan.
      - name: pin comments
        id: pin_comments
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' }}
        env:
          PINS_DIFF: ${{ runner.temp }}/lint/pin-comments.diff
        run: |
          .github/scripts/check-pin-comments.sh 2>&1 \
            | tee "${RUNNER_TEMP}/lint/pin-comments.txt" \
            | .github/scripts/annotate-gcc.sh

      # A pin whose commit changed while its version did not: a re-pointed tag
      # or rewritten history. Needs the base of a pull request.
      - name: pin changes
        id: pin_changes
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/check-pin-changes.sh 2>&1 \
            | tee "${RUNNER_TEMP}/lint/pin-changes.txt" \
            | .github/scripts/annotate-gcc.sh

      - name: shellcheck
        id: shellcheck
        if: ${{ !cancelled() && steps.changes.outputs.scripts == 'true' }}
        run: |
          shellcheck --external-sources --enable=all --severity=style -f gcc \
            .github/scripts/*.sh .github/scripts/tests/*.sh .github/scripts/tests/lib/*.sh 2>&1 \
            | tee "${RUNNER_TEMP}/lint/shellcheck.txt" \
            | .github/scripts/annotate-gcc.sh

      - name: shfmt
        id: shfmt
        if: ${{ !cancelled() && steps.changes.outputs.scripts == 'true' }}
        run: |
          shfmt --simplify --diff --indent 4 --case-indent \
            .github/scripts/*.sh .github/scripts/tests/*.sh .github/scripts/tests/lib/*.sh 2>&1 \
            | tee "${RUNNER_TEMP}/lint/shfmt.txt"

      # One file per tested script in tests/; each runs offline, prints one
      # line per check and exits 1 if any failed. All of them run, so the
      # report shows every failing check.
      - name: script tests
        id: tests
        if: ${{ !cancelled() && steps.changes.outputs.scripts == 'true' }}
        run: |
          (
            status=0
            for test in .github/scripts/tests/*.sh; do
              echo "${test}:"
              "${test}" 2>&1 || status=1
            done
            exit "${status}"
          ) | tee "${RUNNER_TEMP}/lint/tests.txt"

      # Prints a unified diff per tracked Markdown file that is not formatted,
      # like shfmt --diff; it has no line format to annotate.
      - name: mdformat
        id: mdformat
        if: ${{ !cancelled() && steps.changes.outputs.markdown == 'true' }}
        run: .github/scripts/mdformat-diff.sh 2>&1 | tee "${RUNNER_TEMP}/lint/mdformat.txt"

      # Feeds the report job's condition and its suggestion step: which
      # formatter and pin comment hunks to post as suggested changes and which
      # suggestions no longer apply. Read-only. Runs on every pull request run,
      # pass or fail, because an earlier suggestion can be outdated even when
      # no formatter ran.
      - name: Plan the formatter suggestions
        id: suggestions
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          LINT_DIR: ${{ runner.temp }}/lint
          PLAN_DIR: ${{ runner.temp }}/suggestions
        run: .github/scripts/suggestions-plan.sh

      - name: Upload the suggestion plan
        if: ${{ !cancelled() && steps.suggestions.outputs.work == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suggestions
          path: ${{ runner.temp }}/suggestions
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      # Feeds the report job's condition and its comment step, which need it
      # only after a pass: the comment step then runs only to resolve an
      # active comment.
      - name: Look for an active lint comment
        id: comment
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-comment.sh find

      # The report and its upload feed only the report job's download, which
      # runs only when this job did not succeed: so they run only when a step
      # failed, on a pull request the report job handles. Only writes the
      # report; the failed check steps already fail the job.
      - name: report
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          OUTCOME_CHANGES: ${{ steps.changes.outcome }}
          OUTCOME_ACTIONLINT: ${{ steps.actionlint.outcome }}
          OUTCOME_ZIZMOR: ${{ steps.zizmor.outcome }}
          OUTCOME_PIN_COMMENTS: ${{ steps.pin_comments.outcome }}
          OUTCOME_PIN_CHANGES: ${{ steps.pin_changes.outcome }}
          OUTCOME_SHELLCHECK: ${{ steps.shellcheck.outcome }}
          OUTCOME_SHFMT: ${{ steps.shfmt.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_MDFORMAT: ${{ steps.mdformat.outcome }}
          OUTCOME_SUGGESTIONS: ${{ steps.suggestions.outcome }}
          LINT_DIR: ${{ runner.temp }}/lint
          MAX_OUTPUT_CHARS: "12000"
        run: .github/scripts/lint-report.sh

      - name: Upload lint report
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint/report.md
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

  # Runs only when there is something to write: a failure to report, an
  # active comment a pass must resolve, or a suggestion plan to carry out.
  report:
    name: report
    needs: lint
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.lint.result == 'failure' || needs.lint.outputs.active-comment == 'true' || needs.lint.outputs.suggestions-work == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the comment script
      actions: read # download the lint report and the suggestion plan
      pull-requests: write # create, edit and minimize the lint comment; post suggestions, reply to and minimize outdated ones
    steps:
      # The merge commit, for pr-comment.sh and suggestions-apply.sh. They run
      # from the pull request with pull-requests: write, which is why this job
      # runs for same-repo pull requests only: their authors can already push
      # here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # A passing run only resolves the comment and never reads the report.
      - name: Download lint report
        if: ${{ needs.lint.result != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint-report

      # Not when the job runs only for suggestions after a pass with no
      # comment to resolve.
      - name: Sync the lint comment
        if: ${{ needs.lint.result == 'failure' || needs.lint.outputs.active-comment == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_FILE: ${{ runner.temp }}/lint-report/report.md
        run: .github/scripts/pr-comment.sh sync

      - name: Download the suggestion plan
        if: ${{ !cancelled() && needs.lint.outputs.suggestions-work == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suggestions
          path: ${{ runner.temp }}/suggestions

      - name: Apply the suggestion plan
        if: ${{ !cancelled() && needs.lint.outputs.suggestions-work == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_DIR: ${{ runner.temp }}/suggestions
        run: .github/scripts/suggestions-apply.sh
