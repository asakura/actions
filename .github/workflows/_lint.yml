name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and shfmt from the Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt

      - name: Install actionlint and zizmor
        env:
          # Release tarballs; bump each version together with its sha256.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          .github/scripts/install-binary.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" actionlint actionlint
          .github/scripts/install-binary.sh \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "${ZIZMOR_SHA256}" zizmor zizmor
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: actionlint
        env:
          SHELLCHECK_OPTS: --enable=all --severity=style
        run: actionlint

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=auditor --format=github .

      - name: shellcheck
        run: shellcheck --enable=all --severity=style .github/scripts/*.sh

      - name: shfmt
        run: shfmt --simplify --diff --indent 4 --case-indent .github/scripts/*.sh
