name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the scripts and workflows to lint
      pull-requests: read # list the files the pull request changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The check steps are skipped independently, so none is sure to run
      # first; they all write their output here. It runs before anything that
      # can fail, so the checks never find it missing.
      - name: Create the lint output directory
        run: mkdir -p "${RUNNER_TEMP}/lint"

      # Decides which tools run; it never filters their findings.
      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/changed-files.sh

      - name: Install shellcheck and shfmt from the Ubuntu archive
        if: ${{ steps.changes.outputs.workflows == 'true' || steps.changes.outputs.scripts == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt

      - name: Install actionlint and zizmor
        if: ${{ steps.changes.outputs.workflows == 'true' }}
        env:
          # Release tarballs; bump each version together with its sha256.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          .github/scripts/install-binary.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" actionlint actionlint
          .github/scripts/install-binary.sh \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "${ZIZMOR_SHA256}" zizmor zizmor
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # Each check keeps its own exit status (the step turns red) and saves
      # its output for the report; annotations come from the same run.
      - name: actionlint
        id: actionlint
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' }}
        env:
          SHELLCHECK_OPTS: --enable=all --severity=style
          ACTIONLINT_FORMAT: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}} [{{$err.Kind}}]\n{{end}}'
        run: actionlint -format "${ACTIONLINT_FORMAT}" 2>&1 | tee "${RUNNER_TEMP}/lint/actionlint.txt"

      - name: zizmor
        id: zizmor
        if: ${{ !cancelled() && steps.changes.outputs.workflows == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=auditor --format=github . 2>&1 | tee "${RUNNER_TEMP}/lint/zizmor.txt"

      - name: shellcheck
        id: shellcheck
        if: ${{ !cancelled() && steps.changes.outputs.scripts == 'true' }}
        run: |
          shellcheck --enable=all --severity=style -f gcc .github/scripts/*.sh 2>&1 \
            | tee "${RUNNER_TEMP}/lint/shellcheck.txt" \
            | .github/scripts/annotate-gcc.sh

      - name: shfmt
        id: shfmt
        if: ${{ !cancelled() && steps.changes.outputs.scripts == 'true' }}
        run: shfmt --simplify --diff --indent 4 --case-indent .github/scripts/*.sh 2>&1 | tee "${RUNNER_TEMP}/lint/shfmt.txt"

      # The report and its upload feed only the PR comment, so they run exactly
      # when the report job does. Only writes the report; the failed check
      # steps already fail the job.
      - name: report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          OUTCOME_CHANGES: ${{ steps.changes.outcome }}
          OUTCOME_ACTIONLINT: ${{ steps.actionlint.outcome }}
          OUTCOME_ZIZMOR: ${{ steps.zizmor.outcome }}
          OUTCOME_SHELLCHECK: ${{ steps.shellcheck.outcome }}
          OUTCOME_SHFMT: ${{ steps.shfmt.outcome }}
        run: .github/scripts/lint-report.sh

      - name: Upload lint report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint/report.md
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

  report:
    name: report
    needs: lint
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the comment script
      actions: read # download the lint artifact
      pull-requests: write # create, update or delete the lint comment
    steps:
      # Only for the comment script; no PR code is executed, same-repo PRs only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # A passing run only deletes the comment and never reads the report.
      - name: Download lint report
        if: ${{ needs.lint.result != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint-report

      - name: Sync the lint comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINT_RESULT: ${{ needs.lint.result }}
          REPORT_FILE: ${{ runner.temp }}/lint-report/report.md
        run: .github/scripts/pr-comment.sh
